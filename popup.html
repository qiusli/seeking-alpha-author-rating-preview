<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head>
  <body>
    <form id="ticker-form">
      <h1>Financials</h1>
      <p>Enter a ticker to open its financial preview.</p>
      <input id="ticker" autocomplete="off" autocapitalize="characters" placeholder="NVDA or VHI:CA" required autofocus>
      <button type="submit">Open financials</button>
      <output id="status" aria-live="polite"></output>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
